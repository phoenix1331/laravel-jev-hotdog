name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on the fake driver, so no secrets are needed.
env:
  JEV_FAKE: true
  JEV_API_KEY: ''

jobs:
  quality:
    name: pint and larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: pint
        run: vendor/bin/pint --test

      - name: larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: tests (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, exif
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: npm run build

      - name: prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: php artisan test

      # Fake mode scores 100% by design: this proves every committed sample
      # loads, normalises and runs end to end, not how good the model is.
      - name: eval pipeline
        run: php artisan hotdog:eval --min=100

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, imagick, exif
          coverage: pcov

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: npm run build

      - name: prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: tests with coverage
        shell: bash
        run: php artisan test --coverage --min=90 | tee coverage.txt

      - name: coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
